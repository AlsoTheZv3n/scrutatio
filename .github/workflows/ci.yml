name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork PRs get a read-only token and no secrets. Every job below is fully
# offline by design, so fork PRs run identically to branch pushes.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # 3.12 is the floor declared in pyproject.toml; uv reads .python-version.
      - name: Set up Python
        run: uv python install

      # `serve` is fastapi + uvicorn, small and offline-testable. `embeddings`
      # is deliberately excluded: it pulls torch, and the storage layer it
      # feeds is tested with constructed vectors instead.
      - name: Install dependencies
        run: uv sync --all-groups --extra serve --frozen

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test with coverage gate
        run: uv run pytest

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
