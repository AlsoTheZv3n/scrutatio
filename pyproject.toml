[project]
name = "scrutatio"
version = "0.1.0"
description = "Oncology clinical-trial matching: free-text patient situation in, ranked trials with per-criterion reasoning out."
readme = "README.md"
license = { file = "LICENSE" }
# The hard ==3.12.* pin existed because databricks-connect declares that range and
# Databricks serverless executed 3.12.3. Both reasons are gone; 3.12 stays the floor
# because nothing in the codebase needs newer syntax.
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "duckdb>=1.1",
    # Bulk-loading vectors through Arrow rather than executemany: profiled at
    # 95% of the embedding wall clock before, ~1% after.
    "pyarrow>=17",
    "numpy>=1.26",
]

[project.scripts]
scrutatio = "scrutatio.pipeline.cli:main"

[project.optional-dependencies]
# Pulls torch; kept out of the default install so CI stays fast and offline.
embeddings = [
    "sentence-transformers>=3.0",
    # Named explicitly even though sentence-transformers pulls it: [tool.uv.sources]
    # below only applies to direct dependencies, and without this entry uv resolves
    # torch from PyPI — which on Windows means the CPU build.
    "torch>=2.13",
]
tracking = [
    "mlflow>=3.0",
]
# Evaluation against TREC Clinical Trials 2021. Optional because nothing in the
# pipeline or the API needs it — but the Definition of Done does, and the claim
# "beats the baseline" is worthless if the metric is homemade. pytrec_eval wraps
# NIST's own trec_eval; rank_bm25 is the keyword competitor.
evaluation = [
    "pytrec-eval-terrier>=0.5",
    "rank-bm25>=0.2",
]
# The HTTP surface the frontend talks to. Optional because the pipeline itself
# never needs it — backfill, extract and embed are all CLI.
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "datamodel-code-generator>=0.26",
    "respx>=0.21",
    # Both HTTP clients are installed on purpose, and only here.
    #
    # Starlette 1.6 prefers `httpx2` in `starlette.testclient` and falls back to
    # `httpx` with a StarletteDeprecationWarning — read from the installed
    # source, and it was the only warning the suite emitted. Meanwhile respx
    # 0.23.1 declares `httpx>=0.25.0` and does not know about httpx2, so
    # replacing httpx would break every mocked-transport test.
    #
    # Different module names, so they coexist: the TestClient resolves httpx2,
    # respx keeps patching httpx, and the production clients are untouched.
    "httpx2>=2.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutatio"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "A",             # builtins shadowing
    "C4",            # comprehensions
    "RET",           # return consistency
    "SIM",           # simplify
    "PTH",           # use pathlib
    "TID",           # tidy imports
    # Not just for stubs: PYI034 caught four `__enter__` methods annotated with
    # their own class name instead of `typing.Self`, and nothing else in this
    # list had an opinion about it. A gap in the net is why outdated idioms
    # survive review.
    "PYI",
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests; pytest needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded dummy secrets in fixtures
# Generated from schemas/ctgov-openapi.yaml — regenerate with scripts/gen-models.ps1,
# never edit by hand. E501 is unavoidable here: three age/duration fields carry a
# regex from the upstream schema as a single 101-character string literal, and no
# formatter can break a string. Rewriting the registry's pattern is not ours to do.
"src/scrutatio/clients/ctgov/models.py" = ["E501"]

# ---------------------------------------------------------------------------
# How src/scrutatio/clients/ctgov/models.py is produced. Regenerate with:
#
#     uv run datamodel-codegen
#
# The flags used to live in a PowerShell script, and before that nowhere at all —
# models.py carried a `# generated by datamodel-codegen` header and no command.
# That is why it still emitted `constr(...)` in type positions long after Pydantic
# offered `Annotated[str, Field(...)]`: a generated file whose command is lost is a
# file nobody can fix. Here instead, because a build step is configuration, not a
# platform-specific script, and CI verifies it with `--check`.
#
# Flag rationale, so the next change is a decision rather than a guess:
#
#   use-annotated + field-constraints
#       Emit `Annotated[str, Field(min_length=11, ...)]` instead of `constr(...)`.
#       `constr()` is a function call, so a type checker rejects it in an
#       annotation, and `constr(...) | None` is not a valid type expression at all.
#   snake-case-field
#       The registry sends camelCase; the codebase reads snake_case. Aliases are
#       kept, so wire compatibility is unaffected.
#   target-python-version 3.12
#       Matches requires-python, and is what lets the generator use StrEnum.
#   formatters ruff-check + ruff-format
#       The project's own toolchain. ruff-format alone leaves imports unsorted
#       (I001); ruff-check applies the isort fix. Naming both also silences the
#       generator's FutureWarning about black/isort becoming opt-in.
#
# Accepted: three age/duration fields carry a regex from the upstream schema as a
# single 101-character string literal. No formatter can break a string, so E501 is
# ignored for the file above rather than worked around in the schema.
#
# Not possible: splitting the output across modules. Measured — `--output` pointing
# at a directory produces one file when the input is a single schema, and
# multi-module output needs multi-file input, which the registry does not publish.
[tool.datamodel-codegen]
# Without this the header carries a generation timestamp, so a regenerated file
# always differs from the committed one and `--check` reports drift on every run.
# A check that always fails is a check that gets deleted.
disable-timestamp = true
field-constraints = true
formatters = ["ruff-check", "ruff-format"]
input = "schemas/ctgov-openapi.yaml"
input-file-type = "openapi"
output = "src/scrutatio/clients/ctgov/models.py"
output-model-type = "pydantic_v2.BaseModel"
snake-case-field = true
target-python-version = "3.12"
use-annotated = true
use-double-quotes = true
use-schema-description = true
use-standard-collections = true

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=scrutatio",
    "--cov-report=term-missing",
    # No `--cov-report=xml`. It wrote a 97 KB coverage.xml on every single run and
    # nothing read it: there is no Codecov step, no artifact upload, no badge. Add
    # it back together with the consumer, not before.
    "--cov-fail-under=80",
]
markers = [
    "integration: hits a live external service (skipped unless credentials present)",
]
# Every warning is an error. Not just DeprecationWarning — that scoping was tried
# here first and had a hole big enough to drive the original bug through:
#
#   StarletteDeprecationWarning -> UserWarning -> Warning
#   issubclass(StarletteDeprecationWarning, DeprecationWarning) is False
#
# So `error::DeprecationWarning` would have let through the very warning that
# motivated adding it, and also `sentence_transformers`' renamed-method notice,
# which is raised as a FutureWarning. Libraries pick whatever category they like;
# scoping the filter to one category trusts that choice.
#
# Measured before committing to this: the suite passes under bare `-W error` with
# zero exemptions, so the strict form is enforceable today rather than aspirational.
# When a dependency introduces a warning, CI fails and accepting it becomes an
# explicit `ignore::` line with a reason beside it, instead of a number in a
# summary that nobody reads.
filterwarnings = ["error"]

[tool.coverage.run]
branch = true
source = ["src/scrutatio"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# PyPI ships CPU-only torch on Windows, and `uv sync` silently reverts a
# manually installed CUDA build to it. Measured consequence: embedding 351,745
# criteria takes ~22 hours on CPU against minutes on the GPU, so the difference
# is not a preference. Declaring the index makes the CUDA wheel the thing that
# gets installed and survives a sync.
#
# Scoped to Windows because that is the machine this runs on; CI installs
# neither (the `embeddings` extra is excluded there) so it never resolves this.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32'" }]
