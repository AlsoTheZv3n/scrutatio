[project]
name = "scrutatio"
version = "0.1.0"
description = "Oncology clinical-trial matching: free-text patient situation in, ranked trials with per-criterion reasoning out."
readme = "README.md"
license = { file = "LICENSE" }
# The hard ==3.12.* pin existed because databricks-connect declares that range and
# Databricks serverless executed 3.12.3. Both reasons are gone; 3.12 stays the floor
# because nothing in the codebase needs newer syntax.
requires-python = ">=3.12"

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "duckdb>=1.1",
]

[project.scripts]
scrutatio = "scrutatio.pipeline.cli:main"

[project.optional-dependencies]
# Pulls torch; kept out of the default install so CI stays fast and offline.
embeddings = [
    "sentence-transformers>=3.0",
]
tracking = [
    "mlflow>=3.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "datamodel-code-generator>=0.26",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrutatio"]

# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "N",             # pep8-naming
    "UP",            # pyupgrade
    "B",             # bugbear
    "S",             # bandit (security)
    "A",             # builtins shadowing
    "C4",            # comprehensions
    "RET",           # return consistency
    "SIM",           # simplify
    "PTH",           # use pathlib
    "TID",           # tidy imports
    "RUF",
]
ignore = [
    "S101",  # assert is fine in tests; pytest needs it
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # hardcoded dummy secrets in fixtures

# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--strict-markers",
    "--cov=scrutatio",
    "--cov-report=term-missing",
    "--cov-report=xml",
    "--cov-fail-under=80",
]
markers = [
    "integration: hits a live external service (skipped unless credentials present)",
]

[tool.coverage.run]
branch = true
source = ["src/scrutatio"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
